<title>Collect Use</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header (title · tabs · filters) over a photo-first card grid; full-screen sheets for detail, edit and crop. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --sunken:#E9ECF1; --ink:#15181E; --muted:#667085; --line:#DDE1E8;
  --accent:#2C47D8; --on-accent:#FFFFFF; --accent-soft:#E4E8FB;
  --sale:#C92A44; --ok:#1B8354; --shade:rgba(12,14,20,.55);
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191C22; --sunken:#22262E; --ink:#ECEEF3; --muted:#959CAB; --line:#2B303A;
  --accent:#8CA0FF; --on-accent:#0E1330; --accent-soft:#232A4D;
  --sale:#FF8092; --ok:#62CF9A; --shade:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --sunken:#22262E; --ink:#ECEEF3; --muted:#959CAB; --line:#2B303A;
  --accent:#8CA0FF; --on-accent:#0E1330; --accent-soft:#232A4D;
  --sale:#FF8092; --ok:#62CF9A; --shade:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 10px}
.top .inner{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:3px;border-radius:var(--r)}
.tabs button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.tabs b{font-family:var(--mono);font-size:12px;font-weight:500;margin-left:4px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters>*{flex:none}
.filters input[type=search]{width:150px}

input[type=text],input[type=search],input[type=url],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
textarea{width:100%;min-height:84px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:38px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--sale)}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

main{padding-block:16px 96px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.summary{color:var(--muted);font-size:13px;margin:0 0 10px}
.summary b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;min-width:0}
.cover{position:relative;aspect-ratio:4/5;background:var(--sunken);display:grid;place-items:center;color:var(--muted);font-size:12px}
.cover img,.cover video{width:100%;height:100%;object-fit:contain;display:block}
.cover .where{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--ink);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover .cnt{position:absolute;right:8px;bottom:8px;background:var(--shade);color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-family:var(--mono)}
.card .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .nm{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.price small{font-family:var(--font);font-weight:400;color:var(--muted);font-size:11px;margin-right:5px}
.delta{font-size:11px;font-weight:600}
.delta.good{color:var(--ok)} .delta.bad{color:var(--sale)}
.marks{display:flex;flex-wrap:wrap;gap:4px}
.mark{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;max-width:560px;margin:24px auto;color:var(--muted)}
.empty h2{margin:0 0 8px;color:var(--ink);font-size:17px;text-wrap:balance}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
footer.tools{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12px}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;box-shadow:0 6px 18px var(--shade)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;justify-content:center;align-items:stretch}
.panel{background:var(--bg);width:100%;max-width:640px;display:flex;flex-direction:column;min-height:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{padding:28px}.panel{border-radius:14px;overflow:hidden}}
.panel>.hd{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.panel>.hd h2{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel>.bd{flex:1;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:16px;min-height:0}
.panel>.ft{display:flex;gap:8px;padding-block:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.panel>.ft .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lb{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fld .hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.fld{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fld input[type=text],.fld input[type=url],.fld input[type=date],.fld select{width:100%}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumb{position:relative;flex:none;width:92px;height:115px;border-radius:8px;overflow:hidden;background:var(--sunken);border:1px solid var(--line)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--shade);color:#fff;line-height:1}
.thumb .vid{position:absolute;left:4px;bottom:4px;background:var(--shade);color:#fff;font-size:10px;border-radius:4px;padding:0 5px}
.thumb button.recrop{right:auto;top:auto;left:4px;bottom:4px;width:auto;height:auto;border-radius:4px;font-size:11px;padding:3px 8px}
.loc{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.local{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}
.gallery>*{flex:none;max-width:86%;max-height:62vh;border-radius:var(--r);scroll-snap-align:start;background:var(--sunken);object-fit:contain}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.memo{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.title-lg{font-size:19px;font-weight:700;margin:0;overflow-wrap:anywhere;text-wrap:balance}
a.link{color:var(--accent);font-weight:600;overflow-wrap:anywhere}

.crop-stage{flex:1;display:grid;place-items:center;min-height:0;padding-block:12px;overflow:auto}
.crop-wrap{position:relative;overflow:hidden;line-height:0;touch-action:none;user-select:none}
.crop-wrap img{max-width:100%;max-height:64vh;display:block;-webkit-user-drag:none}
.crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move}
.crop-box i{position:absolute;width:28px;height:28px;border:4px solid #fff}
.crop-box .nw{left:-4px;top:-4px;border-right:0;border-bottom:0;cursor:nwse-resize}
.crop-box .ne{right:-4px;top:-4px;border-left:0;border-bottom:0;cursor:nesw-resize}
.crop-box .sw{left:-4px;bottom:-4px;border-right:0;border-top:0;cursor:nesw-resize}
.crop-box .se{right:-4px;bottom:-4px;border-left:0;border-top:0;cursor:nwse-resize}

.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar .summary{margin:0}
.othumb{width:46px;height:58px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--sunken);color:var(--muted);font-size:11px;overflow:hidden}
.othumb img{width:100%;height:100%;object-fit:cover;display:block}
.orow{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.orow input[type=checkbox]{width:20px;height:20px}
.orow .nm-in{width:100%}
.orow .sub{grid-column:2 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.orow .sub input{width:108px}
.orow .sub input.q{width:60px}
.orow .out{font-family:var(--mono);color:var(--ink)}
.meas{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.plist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.prow{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;min-width:0;width:100%}
.prow img,.prow .ph{width:40px;height:50px;border-radius:5px;object-fit:cover;background:var(--sunken);flex:none}
.prow input{width:20px;height:20px;flex:none}
.pn{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px}
.pn small{font-weight:400;color:var(--muted)}
button.thumb{padding:0}
div.thumb{width:auto;height:240px;max-width:92%}
div.thumb img,div.thumb video{width:auto;height:100%;max-width:100%;object-fit:contain}
input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
.tf{width:92px}
.trow{display:grid;grid-template-columns:1fr auto 1fr auto auto auto;gap:6px;align-items:center}
.trow input{width:100%;min-width:0}
.fld .trow select{width:auto}
.pick{position:relative;display:inline-flex;align-items:center;cursor:pointer;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.paste{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;min-height:42px;max-height:64px;overflow:hidden;background:var(--surface);font-size:13px}
.paste:empty::before{content:attr(data-ph);color:var(--muted)}
.panel>.bd>*{flex-shrink:0}
.xrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xrow .chip{min-height:26px;padding:2px 10px;font-size:12px}
.chip[data-s="1"]{background:var(--sunken);border-color:var(--muted);color:var(--ink);font-weight:600}
.chip[data-s="2"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.kv a.link{font-weight:400}
.lrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.msub{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.msub select{width:auto}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:20px;height:20px;flex:none}
.fin{margin:0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px);text-align:center}
</style>

<header class="top gut"><div class="inner">
  <div class="brand"><h1>Collect <span>Use</span></h1><small>위시 · 소장 기록</small></div>

    <input type="text" id="quick-link" placeholder="복사한 상품 링크 붙여넣기" autocomplete="off" enterkeyhint="go">

</div></main>

<script>
const STORES=[['지그재그',['zigzag']],['29CM',['29cm']],['무신사',['musinsa']],['네이버쇼핑',['naver']],['자라',['zara']],
  ['롯데면세점',['lottedfs']],['신라면세점',['shilladfs']],['신세계면세점',['ssgdfs']],['카카오톡 선물하기',['gift.kakao']],['오프라인 매장',[]],['해외 현지',[]]];
const CATS=['상의','하의','아우터','원피스','신발','가방','액세서리','뷰티','기타'];
const MARKS=[['rebuy','재구매'],['travel','여행·면세'],['tryon','입어봄·온라인 구매 예정']];
const CUR={KRW:'₩',USD:'$',JPY:'¥',EUR:'€',CNY:'CN¥',THB:'฿',VND:'₫'};
const MAX_VIDEO=20*1024*1024;
const FITS=['슬림핏','정핏','세미오버','오버핏'];
const PARTS=['어깨','가슴','소매','소매통','총장','허리','엉덩이','허벅지','밑위','밑단'];
const GIRTH=['가슴','허리','엉덩이','허벅지','밑단','소매통'];
function canonPart(raw){
  const s=String(raw||'').replace(/\s+/g,'');
  const t=/둘레/.test(s)?'round':'flat';
  const rules=[[/어깨/,'어깨'],[/소매통|팔통/,'소매통'],[/소매|팔길이/,'소매'],[/가슴|품/,'가슴'],[/허리/,'허리'],[/엉덩이|힙/,'엉덩이'],[/허벅지/,'허벅지'],[/밑위/,'밑위'],[/밑단/,'밑단'],[/총장|기장|전체길이/,'총장']];
  for(const [re,k] of rules) if(re.test(s)) return {k,t};
  return {k:String(raw||'').trim(),t};
}
const fmtN=n=>String(Math.round(n*10)/10);
function pair(m){const n=parseFloat(m.v);if(!GIRTH.includes(m.k)||!isFinite(n)) return null;return m.t==='round'?{flat:n/2,round:n}:{flat:n,round:n*2}}
const measText=m=>{const p=pair(m);return p?'단면 '+fmtN(p.flat)+' (둘레 '+fmtN(p.round)+')':m.v};
const normMeas=m=>{const c=canonPart(m.k);return {k:c.k,v:String(m.v??''),t:m.t||c.t}};
const storesOf=it=>it.stores&&it.stores.length?it.stores:(it.store?[it.store]:[]);
const linksOf=it=>(it.links&&it.links.length?it.links:(it.link?[it.link]:[])).filter(safeUrl);
const allStores=()=>[...new Set(items.flatMap(storesOf))];
const hasMeas=it=>(it.measures||[]).some(m=>String(m.v||'').trim());
const PART_SETS={top:['어깨','가슴','소매','소매통','총장','밑단'],bottom:['허리','엉덩이','허벅지','밑위','밑단','총장'],dress:['어깨','가슴','허리','엉덩이','소매','총장']};
function partsFor(cat){
  const s=String(cat||'');
  if(/원피스|드레스/.test(s)) return PART_SETS.dress;
  if(/하의|바지|팬츠|슬랙스|데님|스커트|치마|쇼츠/.test(s)) return PART_SETS.bottom;
  if(/상의|아우터|니트|셔츠|블라우스|티셔츠|맨투맨|후드|자켓|재킷|코트|가디건|패딩/.test(s)) return PART_SETS.top;
  return PARTS;
}
function arrangeMeas(list,parts){
  const std=(parts||PARTS).map(p=>({k:p,v:'',t:'flat',std:true})),extra=[];
  for(const m0 of list){
    const m=normMeas(m0);if(!m.k&&!m.v) continue;
    const s=std.find(x=>x.k===m.k);
    if(s&&!s.v&&m.v){s.v=m.v;s.t=m.t} else if(!s||m.v) extra.push(m);
  }
  return [...std,...extra];
}
const WEATHER=['맑음','흐림','비','눈','바람'];
const tnum=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const cleanTemps=l=>(l||[]).map(r=>{let lo=tnum(r.lo),hi=tnum(r.hi);if(lo==null&&hi==null) return null;if(lo==null) lo=hi;if(hi==null) hi=lo;if(lo>hi)[lo,hi]=[hi,lo];return {lo,hi,w:r.w||''}}).filter(Boolean);
const tempText=l=>cleanTemps(l).map(r=>(r.lo===r.hi?r.lo:r.lo+'~'+r.hi)+'℃'+(r.w?' '+r.w:'')).join(' · ');
function tempMatch(x,useW){
  const w=useW?ui.w:'';
  const a=tnum(ui.tLo),b=tnum(ui.tHi);if(a==null&&b==null&&!w) return true;
  const lo=Math.min(a??b,b??a),hi=Math.max(a??b,b??a);
  return cleanTemps(x.temps).some(r=>(!w||r.w===w)&&((a==null&&b==null)||(r.lo<=hi&&r.hi>=lo)));
}
const lookPhotos=l=>l.photos&&l.photos.length?l.photos:(l.media?[l.media]:[]);
function tempEditor(list,prefix){
  const box=h('div',{class:'meas'});
  function draw(){
    box.replaceChildren(...list.map((r,i)=>{

function h(tag,attrs,...kids){

    if(k==='class') el.className=v;
    else if(k==='value') el.value=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);

/* ---------- images ---------- */
function toJpeg(src,sx,sy,sw,sh,max){
  const k=Math.min(1,(max||1600)/Math.max(sw,sh));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
  c.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',.86));
}
async function shrink(file,max){
  try{const bmp=await createImageBitmap(file);const b=await toJpeg(bmp,0,0,bmp.width,bmp.height,max);if(bmp.close)bmp.close();return b||file}catch(e){return file}
}
function openCropper(file,onDone,more,lab){
  const isUrl=typeof file==='string';
  const url=isUrl?file:URL.createObjectURL(file);
  const img=h('img',{src:url,alt:'자를 이미지',draggable:'false'});
  const box=h('div',{class:'crop-box'},['nw','ne','sw','se'].map(c=>h('i',{class:c,'data-c':c})));
  const wrap=h('div',{class:'crop-wrap'},img,box);
  let r={x:0,y:0,w:0,h:0},drag=null;
  const apply=()=>{box.style.left=r.x+'px';box.style.top=r.y+'px';box.style.width=r.w+'px';box.style.height=r.h+'px'};
  img.addEventListener('load',()=>requestAnimationFrame(()=>{const W=img.clientWidth,H=img.clientHeight;r={x:W*.08,y:H*.18,w:W*.84,h:H*.5};apply()}));
  box.addEventListener('pointerdown',e=>{e.preventDefault();box.setPointerCapture(e.pointerId);drag={c:e.target.dataset.c||'move',sx:e.clientX,sy:e.clientY,o:Object.assign({},r)}});
  box.addEventListener('pointermove',e=>{
    if(!drag) return;
    const W=img.clientWidth,H=img.clientHeight,dx=e.clientX-drag.sx,dy=e.clientY-drag.sy,o=drag.o,M=36,c=drag.c;
    if(c==='move'){r={x:clamp(o.x+dx,0,W-o.w),y:clamp(o.y+dy,0,H-o.h),w:o.w,h:o.h}}
    else{let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
      if(c[1]==='w') x1=clamp(x1+dx,0,x2-M); else x2=clamp(x2+dx,x1+M,W);
      if(c[0]==='n') y1=clamp(y1+dy,0,y2-M); else y2=clamp(y2+dy,y1+M,H);
      r={x:x1,y:y1,w:x2-x1,h:y2-y1}}
    apply();
  });
  const end=()=>{drag=null};box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  const done=async(whole,keep)=>{
    const s=img.naturalWidth/img.clientWidth;
    let b=null;
    try{b=whole?await toJpeg(img,0,0,img.naturalWidth,img.naturalHeight):await toJpeg(img,r.x*s,r.y*s,r.w*s,r.h*s)}catch(e){}
    if(!b){toast('이 이미지는 자를 수 없어요');return}
    onDone(b);
    if(keep){toast('넣었어요. 다음 영역을 골라 주세요');return}
    sh.close();if(!isUrl) URL.revokeObjectURL(url);
  };
  const sh=openSheet(lab&&lab.title||'원하는 부분만 자르기',h('div',{class:'crop-stage gut'},wrap),
    h('div',{class:'ft gut'},h('button',{type:'button',class:'btn',onclick:()=>done(true)},lab&&lab.whole||'전체 사용'),h('span',{class:'grow'}),
      more?h('button',{type:'button',class:'btn',onclick:()=>done(false,true)},'넣고 더 자르기'):null,
      h('button',{type:'button',class:'btn primary',onclick:()=>done(false)},lab&&lab.part||'이 영역 넣기')));
}

function allocate(prices,total){
  const sum=prices.reduce((a,b)=>a+b,0);

  return prices.map((p,i)=>{if(i===prices.length-1) return diff-usedUp;const a=Math.round(diff*p/sum);usedUp+=a;return a});
}

    const sum=sum0;
    fin.textContent=ex?money(base,cur)+' − 추가 할인 '+money(ex,cur)+' = 실 결제 '+money(eff,cur):'실 결제 '+money(eff!=null?eff:sum,cur)+(eff==null?' (상품 합계)':'');
    info.textContent='상품 금액 합계 '+money(sum,cur)+(eff!=null?' · 차액 '+(eff-sum).toLocaleString('ko-KR')+' (주문 전체에 걸린 쿠폰·포인트·배송비). 상품 금액 비율대로 나눠 반영해요.':'');
  }
  const list=h('div',{},rows.map((x,i)=>{
    const out=h('span',{class:'out'});outs.push(out);
    const th=h('button',{type:'button',class:'othumb','aria-label':'상품 사진 자르기',onclick:()=>openCropper(file,b=>{x.blob=b;x.url=URL.createObjectURL(b);paint()})});
    const paint=()=>th.replaceChildren(x.url?h('img',{src:x.url,alt:''}):'사진');paint();
    return h('div',{class:'orow'},
      h('input',{type:'checkbox',id:'o-on-'+i,checked:true,'aria-label':'이 상품 추가',onchange:e=>{x.on=e.target.checked;recalc()}}),
      th,h('input',{type:'text',class:'nm-in',id:'o-nm-'+i,value:x.name,'aria-label':'상품 이름',oninput:e=>{x.name=e.target.value}}),
      h('div',{class:'sub'},
        h('input',{type:'text',class:'q',id:'o-q-'+i,inputmode:'numeric',value:x.qty,'aria-label':'수량',oninput:e=>{x.qty=num(e.target.value)||1}}),'개',
        h('input',{type:'text',id:'o-p-'+i,inputmode:'decimal',value:x.price,'aria-label':'금액',oninput:e=>{x.price=num(e.target.value)||0;recalc()}}),out,
        h('select',{id:'o-c-'+i,'aria-label':'이 상품의 카테고리',onchange:e=>{x.cat=e.target.value}},h('option',{value:''},'카테고리: 공통'),catOpts.map(o=>h('option',{value:o},o)))));
  }));
  total.addEventListener('input',recalc);
  const fl=(label,el,opts)=>h('div',{class:'fld'},h('label',{for:el.id},label),opts&&opts.length?h('div',{class:'chips'},opts.map(o=>h('button',{type:'button',class:'chip',onclick:()=>{el.value=o}},o))):null,el);
  const dateF=fl('구매일',date);
  const ownBox=h('div',{style:'display:flex;flex-direction:column;gap:16px'},fl('캡쳐에 적힌 최종 결제금액',total),
    h('label',{class:'chk',for:'o-ex-on'},exOn,'캡쳐 이후 추가 결제 할인이 있었어요 (토스·카드 즉시할인, 적립금 등)'),exBox,fin,info);
  const stBtns=h('div',{class:'tabs'},[['wish','위시 (살 것)'],['owned','소장 (산 것)']].map(([k,l])=>h('button',{type:'button','data-k':k,onclick:()=>{st=k;syncSt()}},l)));
  function syncSt(){stBtns.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.k===st)));ownBox.hidden=dateF.hidden=st!=='owned';recalc()}
  const body=h('div',{class:'bd gut'},
    h('p',{class:'hint',style:'margin:0'},'읽은 내용이 캡쳐와 맞는지 확인하고 틀린 곳은 고쳐 주세요. 상품 사진은 캡쳐에서 자동으로 잘라 넣어요. 잘못 잘렸거나 비어 있으면 사진 칸을 눌러 직접 잘라 주세요. 금액은 줄 전체 금액(수량 포함)이에요.'),
    stBtns,fl('구매처',store,storeOpts),dateF,
    list,
    ownBox,
    fl('카테고리 (전체 공통)',cat,catOpts),
    h('div',{class:'fld'},h('label',{for:'o-tags'},'태그 (전체 공통)'),tagOpts.length?h('div',{class:'chips'},tagOpts.map(t=>h('button',{type:'button',class:'chip',onclick:()=>{const c=tags.value.split(',').map(s=>s.trim()).filter(Boolean);if(!c.includes(t)) tags.value=[...c,t].join(', ')}},'#'+t))):null,tags));
  const save=h('button',{type:'button',class:'btn primary',onclick:async()=>{
    const act=rows.filter(x=>x.on&&!x.done&&(x.name.trim()||x.price));
    if(!act.length){toast('추가할 상품을 하나 이상 선택해 주세요');return}
    save.disabled=true;save.textContent='추가하는 중…';
    const ex=exOn.checked?(num(exAmt.value)||0):0,exMemo=ex?'추가 결제 할인 '+money(ex,cur)+(exNote.value.trim()?' ('+exNote.value.trim()+')':'')+' · 주문 전체 기준':'';
    const now=Date.now(),orderId='o'+now,tg=[...new Set(tags.value.split(/[,#]/).map(t=>t.trim()).filter(Boolean))];
    try{
      for(const [i,x] of act.entries()){
        let media=[];
        if(x.blob){if(assets){const u=await assets.upload(x.blob,{type:'image/jpeg'});media=[{id:u.id,type:'image'}]}else if(local) media=[{url:x.url,type:'image'}]}
        await persist(null,{status:st,name:x.name.trim(),link:'',links:[],stores:store.value.trim()?[store.value.trim()]:[],store:store.value.trim(),category:x.cat||cat.value.trim(),currency:cur,salePrice:st==='wish'?x.price:null,
        boughtPrice:st==='owned'?x.price+(x.adj||0):null,boughtDate:st==='owned'?date.value:'',qty:x.qty,orderAdj:null,extraDisc:st==='owned'?Math.max(0,-(x.adj||0)):0,orderId:st==='owned'?orderId:null,marks:[],tags:tg,memo:'',media,createdAt:now+i,updatedAt:now+i});
        x.done=true;
      }
      ui.tab=st;s.close();render();toast(act.length+'개를 추가했어요');
    }catch(e){save.disabled=false;save.textContent='기록 추가';toast('일부를 추가하지 못했어요 ('+(e&&e.code||'오류')+'). 목록을 확인해 주세요')}
  }},'기록 추가');
  const s=openSheet('여러 항목 확인',body,h('div',{class:'ft gut'},h('span',{class:'grow'}),save));
  syncSt();
}

/* ---------- global wiring ---------- */

function quickAdd(){
  const el=$('#quick-link');const p=parseShared(el.value);
  if(!p.link&&el.value.trim()){openEditor({name:el.value.trim()});el.value='';return}
  openEditor(p.link?{link:p.link,name:p.name.slice(0,120),store:storeFromUrl(p.link)}:null);el.value='';
}
$('#quick-go').addEventListener('click',quickAdd);
$('#quick-link').addEventListener('keydown',e=>{if(e.key==='Enter') quickAdd()});
function openAddMenu(){
  const body=h('div',{class:'bd gut'},
    h('div',{class:'fld'},filePick('여러 항목 추가하기',{accept:'image/*'},f=>{s.close();importOrder(f[0])}),
      h('span',{class:'hint'},'주문내역, 장바구니, 추천 목록처럼 상품이 여러 개 보이는 캡쳐 한 장을 고르면, 상품마다 이름·금액·사진을 읽어 기록을 따로 만들어요. 저장 전에 확인하고 고칠 수 있어요.')),
    h('div',{class:'fld'},h('button',{type:'button',class:'btn',onclick:()=>{s.close();openEditor(null)}},'한 항목만 추가하기'),
      h('span',{class:'hint'},'제품 하나를 직접 기록해요. 사진·동영상, 링크, 실측, 기온까지 넣을 수 있어요.')));
  const s=openSheet('추가하기',body,null);
}
$('#fab').addEventListener('click',()=>ui.tab==='look'?openLookEditor(null):openAddMenu());
document.addEventListener('paste',e=>{
  const files=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(f=>f.type.startsWith('image/'));
  if(!files.length) return;
  e.preventDefault();
  if(!activeEditor){if(ui.tab==='look') openLookEditor(null);else openEditor(null)}
  activeEditor.crop(files[0]);
});
$('#btn-export').addEventListener('click',async()=>{
  if(!downloads){toast('이 화면에서는 파일 저장을 쓸 수 없어요');return}
  try{await downloads.save({filename:'collect-use-backup.json',data:JSON.stringify({exportedAt:new Date().toISOString(),items,looks},null,1)})}
  catch(e){if(e&&e.code!=='declined') toast('저장하지 못했어요 ('+(e&&e.code||'오류')+')')}
});
$('#btn-usage').addEventListener('click',async()=>{
  if(!assets){$('#usage').textContent='이 화면에서는 확인할 수 없어요';return}
  try{const {usage:u}=await assets.list();const mb=n=>(n/1048576).toFixed(1)+'MB';$('#usage').textContent='사진·동영상 '+u.files+'/'+u.maxFiles+'개 · '+mb(u.bytes)+' / '+mb(u.maxBytes)}
  catch(e){$('#usage').textContent='확인하지 못했어요'}
});
boot();
</script>
